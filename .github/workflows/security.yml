name: Supply-chain security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend from lockfile
        run: npm ci
      - name: Audit frontend production dependencies
        run: npm run audit:prod
      - name: Build frontend
        run: npm run build
      - name: Install backend from lockfile
        working-directory: backend
        run: npm ci
      - name: Audit backend production dependencies
        working-directory: backend
        run: npm run audit:prod
      - name: Test backend
        working-directory: backend
        run: npm test -- --runInBand
      - name: Build backend
        working-directory: backend
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
